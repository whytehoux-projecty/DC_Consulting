<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OG card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#FBFAF7;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:64px;font-family:Inter,sans-serif;color:#17263D}
  .logo{height:52px;display:block}
  .copy{position:absolute;left:64px;top:190px;width:520px}
  .eyebrow{font:600 15px/1.3 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8A6A2B;margin:0 0 18px}
  h1{font:700 52px/1.1 "Source Serif 4",Georgia,serif;margin:0 0 22px;color:#17263D}
  p{font:400 22px/1.5 Inter,sans-serif;color:#3D4B60;margin:0}
  .art{position:absolute;right:64px;top:190px;width:520px}
  .art img{width:100%;height:auto;display:block}
  .rule{position:absolute;left:64px;right:64px;bottom:64px;height:2px;background:#C1A066}
</style></head>
<body><div class="card">
  <img class="logo" src="../src/img/brand/logo-horizontal.svg" alt="">
  <div class="copy">
    <p class="eyebrow">Ground execution for physical commodity contracts</p>
    <h1>We turn procurement mandates into delivered cargo.</h1>
    <p>Sourcing, processing, documentation and logistics.</p>
  </div>
  <div class="art"><img src="../src/img/illustrations/hero-supply-route-1300w.jpg" alt=""></div>
  <div class="rule"></div>
</div></body></html>
